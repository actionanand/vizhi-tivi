name: Vizhi TiVi - Android validation

on:
  pull_request:
    branches: [master, main-android, main-tv]
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vizhi-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install exact SDK packages
        shell: bash
        run: |
          set -euo pipefail
          source android-sdk.properties
          sdkmanager --install "platforms;android-${COMPILE_SDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate scripts, configuration and both Android flavors
        run: |
          python3 scripts/validate-config.py
          python3 -m unittest discover -s scripts/tests -v
          gradle -p android :app:lintMobileDebug :app:lintTvDebug :app:testMobileDebugUnitTest :app:testTvDebugUnitTest :app:assembleMobileDebug :app:assembleTvDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: vizhi-tivi-debug-${{ github.run_id }}
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
