name: Vizhi TiVi - Angular validation

on:
  pull_request:
    branches: [master, main-github]
  push:
    branches: [master, main-github, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/vizhi-tivi/.nvmrc
      - name: Validate Angular client
        shell: bash
        run: |
          set -euo pipefail
          cd web/vizhi-tivi
          npm ci
          npm run lint
          npm test -- --watch=false
          npm run build:gh
