name: Vizhi TiVi - Android platform instrumentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install SDK and isolated emulator image
        shell: bash
        run: |
          set -euo pipefail
          source android-sdk.properties
          sdkmanager --install "platforms;android-${COMPILE_SDK_PACKAGE}" "build-tools;${BUILD_TOOLS_VERSION}" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd -n vizhi-stage1a -k 'system-images;android-35;google_apis;x86_64'
      - name: Start disposable emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          emulator -avd vizhi-stage1a -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/vizhi-emulator.log" 2>&1 &
          adb wait-for-device
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'
          adb shell input keyevent 82
      - name: Run both flavor instrumentation suites
        run: gradle -p android :app:connectedMobileDebugAndroidTest :app:connectedTvDebugAndroidTest --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vizhi-platform-tests-${{ github.run_id }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
